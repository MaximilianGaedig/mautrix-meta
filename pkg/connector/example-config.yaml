# Displayname template for FB users. Available variables:
#  .DisplayName - The display name set by the user.
#  .Username - The username set by the user.
#  .ID - The internal user ID of the user.
displayname_template: '{{or .DisplayName .Username "Unknown user"}}'

# Static proxy address (HTTP or SOCKS5) for connecting to Meta.
proxy:
# If using a Tor proxy in the field above, you can set this to connect to
# facebookwkhpilnemxj7asaniu7vnjjbiltxjqhye3mhbshg7kx5tfyd.onion instead of facebook.com.
tor: false
# HTTP endpoint to request new proxy address from, for dynamically assigned proxies.
# The endpoint must return a JSON body with a string field called proxy_url.
get_proxy_from:
# Should media be proxied too?
proxy_media: false
# Should E2EE messages be proxied too?
proxy_e2ee: false
# Should Messenger Lite login traffic be proxied?
proxy_messenger_lite: true
# Should other traffic, not configured here, be proxied?
proxy_other: true
# Minimum interval between full reconnects in seconds, default is 1 hour
min_full_reconnect_interval_seconds: 3600
# Interval to force refresh the connection (full reconnect), default is 20 hours. Set 0 to disable force refreshes.
force_refresh_interval_seconds: 72000
# Should connection state be cached to allow quicker restarts?
cache_connection_state: false
# Should the bridge mark you as online when you send typing
# notifications? Currently, this only has an effect for E2EE chats on
# Facebook/Messenger. This is about your own presence; see presence_bridging
# for your contacts' presence.
send_presence_on_typing: false
# Bridge contacts' online status ("Active now" / "Active 5m ago") to Matrix
# presence on the ghosts. Active contacts are shown as online, everyone else as
# offline with status_msg "last seen <RFC3339 UTC time>" when Meta shares it.
# Only Facebook and Messenger logins are supported. The bridge reports your own
# account as idle on this stream, like a Messenger tab in the background.
presence_bridging: true
# Post a notice in the chat when a Messenger call starts and ends
# ("Incoming voice call - answer on Messenger", "Missed voice call", "Call ended (1:14)").
# Calls themselves are not bridged; answer them in a Messenger app.
call_notices: true
# Experimental: bridge 1:1 Messenger voice calls to Matrix legacy VoIP (m.call.*).
# Incoming calls ring the Matrix room (from the caller's ghost); answering in
# Element makes the bridge join the call as your bridge device and relay the
# audio. m.call.invite in a 1:1 room places a Messenger call. Needs the bridge's
# Messenger E2EE device and network access to Meta's TURN servers.
# Calling is abuse-monitored by Meta, so this is off by default.
call_bridging: false
# With call_bridging: bridge calls through MatrixRTC (Element Call, the only kind Element X makes and
# rings for) instead of legacy m.call.* events. The Messenger user's ghost joins the room's call on the
# homeserver's LiveKit (its well-known org.matrix.msc4143.rtc_foci / rtc/transports), and the bridge
# lets DM portal members send org.matrix.msc3401.call.member.
call_bridging_matrixrtc: true
# Should view-once messages be disabled entirely?
disable_view_once: false
# Should FB marketplace chats have a separate space inside the main Facebook space?
marketplace_space: true
# Log raw Bloks payloads and login responses even at debug level, with any user identifiers or credentials redacted.
log_redacted_login_responses: false

# Thread backfill settings for syncing older conversations
thread_backfill:
  # Number of batches (pages) to backfill (-1 for unlimited, 0 to disable)
  batch_count: -1
  # Delay between fetching each batch of threads (to avoid rate limiting)
  batch_delay: 2s
